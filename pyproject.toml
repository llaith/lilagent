[tool.poetry]
name = "lilagent"
version = "0.1.0"
description = "LLM-powered multi-agent coding system that generates software packages from specifications"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "lilagent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
crewai = "^0.80.0"
crewai-tools = "^0.12.0"
langchain-anthropic = "^0.2.0"
langchain-openai = "^0.2.0"
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"
requests = "^2.32.0"
rich = "^13.7.0"
typer = "^0.12.0"
pygithub = "^2.3.0"
gitpython = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.5.0"

[tool.poetry.scripts]
lilagent = "lilagent.main:app"
lilagent-github = "lilagent.github_main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

# Example GitHub Actions CI Workflow
#
# This workflow demonstrates how to set up CI that LilAgent's UAT agent
# will check after creating pull requests.
#
# Place this file in: .github/workflows/ci.yml in your repository

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install your package dependencies
          pip install -e .
          # OR if using requirements.txt:
          # pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install ruff black
          black --check .
          ruff check .
        continue-on-error: false

      - name: Run type checking
        run: |
          pip install mypy
          mypy src/
        continue-on-error: true  # Optional: don't fail build on type errors

      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Check package installation
        run: |
          pip install -e .
          # Add commands to verify your package works
          # Example: your-cli-command --version

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

# ====================================================================================
# LILAGENT UAT AGENT INTEGRATION
# ====================================================================================
#
# The UAT agent will check this CI pipeline by:
# 1. Creating a PR with generated code
# 2. Waiting for GitHub Actions to run
# 3. Checking the combined status via GitHub API
# 4. Commenting on the PR with results
#
# If CI fails, the UAT agent can:
# - Report failure back to the gap analyst
# - Include CI error logs in the analysis
# - Trigger remediation if within iteration limits
#
# IMPORTANT: Ensure your CI:
# ✅ Runs on pull_request events
# ✅ Provides clear error messages
# ✅ Fails with non-zero exit code on errors
# ✅ Uses standard tools (pytest, ruff, black, mypy)
#
# ====================================================================================
# CUSTOMIZATION FOR YOUR PROJECT
# ====================================================================================
#
# Modify this workflow based on your project type:
#
# For a CLI tool:
#   - Add step to test CLI commands
#   - Verify help text and argument parsing
#   - Test expected vs actual output
#
# For a library:
#   - Run examples from documentation
#   - Test public API surface
#   - Verify type stubs if provided
#
# For a web API:
#   - Start server in background
#   - Run integration tests against localhost
#   - Test OpenAPI/Swagger spec validation
#
# For a data pipeline:
#   - Test with sample data
#   - Verify transformations
#   - Check output format and schema
#
# ====================================================================================

# Example: Additional job for integration tests
  integration:
    runs-on: ubuntu-latest
    needs: [test]  # Run after unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          pip install -e .

      - name: Run integration tests
        run: |
          # Example: test your CLI end-to-end
          # your-tool process input.txt > output.txt
          # diff output.txt expected.txt

          # Example: test your API
          # Start server in background
          # your-api-server &
          # sleep 5
          # curl http://localhost:8000/health
          # pytest tests/integration/

          echo "Add your integration tests here"

# Example: Matrix testing across Python versions
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          pip install -e .
          pip install pytest
          pytest

# Example: Security scanning
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r src/

      - name: Run Safety dependency check
        run: |
          pip install safety
          safety check
        continue-on-error: true  # Don't fail build, just warn
